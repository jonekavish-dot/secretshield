name: SecretShield secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan the working tree
        id: scan
        run: python3 scripts/secretshield_scan.py --all --json report.json
        continue-on-error: true

      - name: Upload the report to the SecretShield service
        if: always()
        env:
          SECRETSHIELD_URL: ${{ secrets.SECRETSHIELD_URL }}
          SECRETSHIELD_TOKEN: ${{ secrets.SECRETSHIELD_TOKEN }}
        run: python3 scripts/upload_report.py report.json

      - name: Save the report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretshield-report
          path: report.json

      - name: Write the job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              report = json.load(open("report.json"))
          except Exception:
              print("SecretShield report not available.")
              raise SystemExit(0)
          status = report.get("status", "UNKNOWN")
          findings = report.get("findings", [])
          print(f"## SecretShield: {status}\n")
          print(f"Scanned {report.get('scanned_files', 0)} files; {len(findings)} finding(s).\n")
          if findings:
              print("| File | Line | Rule | Severity | Value |")
              print("| --- | --- | --- | --- | --- |")
              for f in findings:
                  print(f"| {f['file']} | {f['line']} | {f['rule']} | {f['severity']} | `{f['redacted_value']}` |")
          PY

      - name: Fail the build when a secret was found
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::SecretShield found a Critical or High severity secret. See the summary above."
          exit 1

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m pytest -q
