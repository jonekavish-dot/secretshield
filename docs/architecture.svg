<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 592" width="920" height="592" role="img" aria-label="SecretShield architecture: three gates between a developer commit and the shared repository">
  <rect width="920" height="592" fill="#0f1b2d"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb0c3"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <text x="32" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#eaf0f6">SecretShield: three gates stand between a secret and the repository</text>
  <text x="32" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9fb0c3">Dev Sprint'26 — Problem 22. A secret must pass all three to reach shared code.</text>

  <!-- ZONE 1: laptop -->
  <rect x="32" y="96" width="256" height="300" rx="12" fill="none" stroke="#2a3d57" stroke-dasharray="4 4"/>
  <text x="48" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2dd4b0">DEVELOPER LAPTOP</text>

  <rect x="56" y="136" width="208" height="44" rx="8" fill="none" stroke="#2a3d57"/>
  <text x="160" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eaf0f6">git commit</text>

  <rect x="56" y="212" width="208" height="88" rx="8" fill="#2dd4b0" fill-opacity="0.12" stroke="#2dd4b0" stroke-width="2"/>
  <text x="160" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2dd4b0">GATE 1</text>
  <text x="160" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eaf0f6">Pre-commit hook</text>
  <text x="160" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">Gitleaks + built-in engine</text>

  <rect x="56" y="332" width="208" height="44" rx="8" fill="none" stroke="#2a3d57"/>
  <text x="160" y="359" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eaf0f6">git push</text>

  <!-- ZONE 2: github -->
  <rect x="332" y="96" width="256" height="300" rx="12" fill="none" stroke="#2a3d57" stroke-dasharray="4 4"/>
  <text x="348" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2dd4b0">GITHUB</text>

  <rect x="356" y="212" width="208" height="88" rx="8" fill="#2dd4b0" fill-opacity="0.12" stroke="#2dd4b0" stroke-width="2"/>
  <text x="460" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2dd4b0">GATE 2</text>
  <text x="460" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eaf0f6">CI gate</text>
  <text x="460" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">GitHub Actions, every push</text>

  <!-- ZONE 3: aws -->
  <rect x="632" y="96" width="256" height="300" rx="12" fill="none" stroke="#2a3d57" stroke-dasharray="4 4"/>
  <text x="648" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2dd4b0">AWS EC2 — DOCKER COMPOSE</text>

  <rect x="656" y="136" width="208" height="40" rx="8" fill="none" stroke="#2a3d57"/>
  <text x="760" y="161" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#eaf0f6">Nginx :80 (reverse proxy)</text>

  <rect x="656" y="196" width="208" height="104" rx="8" fill="#2dd4b0" fill-opacity="0.12" stroke="#2dd4b0" stroke-width="2"/>
  <text x="760" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2dd4b0">GATE 3</text>
  <text x="760" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eaf0f6">FastAPI service</text>
  <text x="760" y="261" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">dashboard · /api/scan</text>
  <text x="760" y="279" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">/api/reports · /health</text>

  <rect x="656" y="320" width="208" height="40" rx="8" fill="none" stroke="#2a3d57"/>
  <text x="760" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#eaf0f6">SQLite (redacted findings)</text>

  <!-- flow arrows -->
  <g fill="none" stroke="#9fb0c3" stroke-width="1.5">
    <path d="M160 180V212" marker-end="url(#arrow)"/>
    <path d="M160 300V332" marker-end="url(#arrow)"/>
    <path d="M264 354H316V256H356" marker-end="url(#arrow)"/>
    <path d="M564 256H616V166H656" marker-end="url(#arrow)"/>
    <path d="M760 176V196" marker-end="url(#arrow)"/>
    <path d="M760 300V320" marker-end="url(#arrow)"/>
  </g>

  <text x="296" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9fb0c3">clean</text>
  <text x="608" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9fb0c3">POST report</text>
  <text x="608" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9fb0c3">token auth</text>

  <!-- failure branches -->
  <g fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M56 256H44V440H292" marker-end="url(#arrow-red)"/>
    <path d="M460 300V412" marker-end="url(#arrow-red)"/>
  </g>
  <rect x="300" y="420" width="190" height="40" rx="8" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b"/>
  <text x="395" y="445" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ff6b6b">Commit blocked / CI fails</text>

  <!-- viewers -->
  <path d="M760 360V416" fill="none" stroke="#9fb0c3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="656" y="420" width="208" height="40" rx="8" fill="none" stroke="#2a3d57"/>
  <text x="760" y="445" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#eaf0f6">Judges &amp; team (public internet)</text>

  <!-- footer -->
  <line x1="32" y1="496" x2="888" y2="496" stroke="#22344d"/>
  <text x="32" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f5b84b">Gate 2 cannot be skipped: it runs on GitHub, so a hook bypassed with --no-verify still fails the pipeline.</text>
  <text x="32" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">Every finding is masked at detection (AKIA************QZXK) and re-masked at the API.</text>
  <text x="32" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb0c3">No report, log or page ever holds a full credential. If the service is down, gates 1 and 2 still pass or fail correctly.</text>
</svg>
