upstream secretshield {
    server web:8000;
}

# Light rate limiting so the public Scan now page cannot be hammered.
limit_req_zone $binary_remote_addr zone=shield:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/secretshield.access.log;
    error_log  /var/log/nginx/secretshield.error.log;

    location /api/scan {
        limit_req zone=shield burst=10 nodelay;
        proxy_pass http://secretshield;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://secretshield;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
